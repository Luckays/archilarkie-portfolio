<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171714">
  <meta name="description" content="BIM prohlížečka projektu Výměnek pro mladý pár.">
  <title>BIM model — Výměnek pro mladý pár</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-snjFbrrL.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DOqFQM0w.css">
</head>
<body>
  <main class="viewer-shell">
    <header class="viewer-header">
      <a class="back-link" href="../index.html?project=1#portfolio" aria-label="Zpět do portfolia">← Portfolio</a>
      <div class="viewer-title"><span>BIM / 01</span><h1>Výměnek pro mladý pár</h1></div>
      <button class="panel-toggle" type="button" aria-expanded="true" aria-controls="bim-panel">Informace</button>
    </header>

    <section class="viewport" aria-label="Interaktivní BIM model">
      <canvas id="bim-canvas"></canvas>
      <div class="loading" id="loading" role="status" aria-live="polite">
        <div class="loading-mark"></div>
        <p id="loading-label">Připravuji BIM prohlížečku…</p>
        <div class="loading-track"><span id="loading-progress"></span></div>
      </div>
      <div class="viewer-hint">Tažením otáčejte · kolečkem přibližujte · pravým tlačítkem posouvejte</div>
      <div class="viewer-tools" aria-label="Nástroje modelu">
        <button type="button" id="home-view">Výchozí pohled</button>
        <button type="button" id="visual-mode" class="is-active">Texturovaný pohled</button>
        <button type="button" id="bim-mode">BIM prvky</button>
      </div>
    </section>

    <aside class="bim-panel" id="bim-panel">
      <section class="panel-section intro-panel">
        <p class="eyebrow">Živý IFC model</p>
        <p>Přepínejte mezi texturovaným a konstrukčním pohledem IFC nebo použijte vodorovný řez modelem.</p>
        <p class="model-stats" id="model-stats">IFC2X3</p>
      </section>

      <section class="panel-section">
        <div class="section-heading"><h2>Řez modelem</h2><label class="switch"><input type="checkbox" id="section-enabled"><span></span></label></div>
        <input class="section-range" id="section-range" type="range" min="0" max="100" value="100" disabled aria-label="Výška vodorovného řezu">
      </section>
    </aside>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('project') === 'roubenka') {
      document.title = 'BIM model — Nový RD s duchem původní roubenky';
      document.querySelector('.back-link').href = '../index.html?project=2&slide=10#portfolio';
      document.querySelector('.viewer-title span').textContent = 'BIM / 02';
      document.querySelector('.viewer-title h1').textContent = 'Nový RD s duchem původní roubenky';
    }
  </script>
</body>
</html>
