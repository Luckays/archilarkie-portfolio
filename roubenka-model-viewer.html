<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interaktivní 3D model projektu Nový RD s duchem původní roubenky.">
  <meta name="theme-color" content="#171714">
  <title>3D model — Nový RD s duchem původní roubenky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="model-viewer.css?v=20261016-4">
</head>
<body>
  <main class="model-page">
    <header>
      <a href="index.html?project=2&slide=10#portfolio">← Portfolio</a>
      <div><span>3D / 02</span><h1>Nový RD s duchem původní roubenky</h1></div>
      <a href="bim-viewer/?project=roubenka">BIM model ↗</a>
    </header>
    <section class="model-stage" data-model-explorer data-auto-rotate="true" data-interior-target="196219.5m 800m -3125.8m" data-interior-orbit="180deg 88deg 1800m" tabindex="0">
      <model-viewer id="house-model" src="assets/models/roubenka/roubenka.glb" alt="Interaktivní 3D model roubenky" camera-controls touch-action="pan-y" orientation="0deg -90deg 0deg" camera-orbit="45deg 65deg 90%" min-camera-orbit="auto auto 1%" max-camera-orbit="auto auto 500%" min-field-of-view="5deg" auto-rotate rotation-per-second="5deg" shadow-intensity="1.2" shadow-softness=".7" exposure="1.05" environment-image="neutral" interaction-prompt="auto">
        <div class="model-loading" slot="poster">Načítám 3D model…</div>
        <button class="model-ar" slot="ar-button">Zobrazit v prostoru</button>
      </model-viewer>
      <div class="view-controls" aria-label="Rychlé pohledy modelu">
        <button type="button" data-model-view="exterior" class="is-active">Exteriér</button>
        <button type="button" data-model-view="interior">Vstoupit dovnitř</button>
      </div>
      <label class="focal-control"><span>Ohnisko <output data-focal-output>35 mm</output></span><input type="range" min="14" max="80" value="35" step="1" data-focal-length aria-label="Ohnisková vzdálenost"></label>
      <div class="walk-controls" data-walk-controls aria-label="Pohyb v interiéru" hidden>
        <span>Procházení interiéru</span>
        <div class="walk-pad">
          <button type="button" data-model-move="forward" aria-label="Dopředu">↑</button>
          <button type="button" data-model-move="left" aria-label="Doleva">←</button>
          <button type="button" data-model-move="back" aria-label="Dozadu">↓</button>
          <button type="button" data-model-move="right" aria-label="Doprava">→</button>
        </div>
        <small>WASD / šipky · tažením se rozhlížejte</small>
      </div>
      <p class="hint">Tažením otáčejte · kolečkem přibližujte · pravým tlačítkem posouvejte</p>
      <div class="model-meta"><span>Klasický 3D model</span><p>Geometrie a materiálové barvy bez BIM dat.</p></div>
    </section>
  </main>
  <script type="module" src="assets/vendor/model-viewer-4.3.1.min.js"></script>
  <script src="model-controls.js?v=20261016-1"></script>
</body>
</html>
